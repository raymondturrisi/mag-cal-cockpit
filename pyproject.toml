[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "magcc"
dynamic = ["version", "readme"]
description = "Live magnetometer hard/soft-iron calibration with a browser cockpit, fed by a simple UDP protocol"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Raymond Turrisi", email = "rturrisi@mit.edu" }]
keywords = ["magnetometer", "calibration", "hard iron", "soft iron", "imu", "wmm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "fastapi",
    "uvicorn[standard]",
    "wmmhr",
]

[project.scripts]
magcc = "magcc.magcc:main"
magcc-replay = "magcc.replay:main"

[project.urls]
Repository = "https://github.com/raymondturrisi/mag-cal-cockpit"

[tool.hatch.version]
path = "src/magcc/__init__.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/media/[^)]+\.mp4)\)'
replacement = '](https://github.com/raymondturrisi/mag-cal-cockpit/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/media/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/raymondturrisi/mag-cal-cockpit/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/magcc"]

[tool.hatch.build.targets.sdist]
include = ["src/magcc", "README.md", "LICENSE", "pyproject.toml"]
